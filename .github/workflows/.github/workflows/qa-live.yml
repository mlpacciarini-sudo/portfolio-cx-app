name: QA live (round-trip de Prioridad con ClickUp real)

# "workflow_dispatch" = este workflow NO se corre solo.
# Aparece un botón "Run workflow" en la pestaña Actions de GitHub,
# y solo se ejecuta cuando alguien lo aprieta a propósito.
# (Tiene sentido: este test cambia un dato real en ClickUp, aunque
# lo restaura al final, así que no queremos que se dispare solo.)
on:
  workflow_dispatch:

jobs:
  live-test:
    name: Playwright — ClickUp real
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      # El token NO está escrito en este archivo. Viene de un "GitHub Secret"
      # que se configura una sola vez en la web de GitHub (ver instrucciones
      # más abajo). GitHub lo inyecta acá como variable de entorno y lo
      # oculta automáticamente en los logs si algo lo llegara a imprimir.
      - name: Correr test live
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: npm run test:e2e:live

      - name: Guardar reporte (siempre, para poder ver qué pasó)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report
          path: playwright-report/
          retention-days: 14
